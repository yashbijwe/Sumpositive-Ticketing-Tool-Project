spring.application.name=Tickeing-backend
# ==============================================================================
# Server Configuration
# ==============================================================================
server.port=8080

# ==============================================================================
# PostgreSQL Datasource Configuration
# ==============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing_db
spring.datasource.username=postgres
spring.datasource.password=yash2003
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP defaults suitable for local dev)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ==============================================================================
# Spring Data JPA / Hibernate Configuration
# ==============================================================================
# Strictly validate schema against entities; do not use update/create-drop (Section 8)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

#  Log SQL statements via standard logging
#logging.level.org.hibernate.SQL=DEBUG
#  Log the actual parameter values bound to the '?' placeholders
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==============================================================================
# Application Security & JWT Configuration (Section 6)
# ==============================================================================
# 256-bit secret key (can be overridden via APP_JWT_SECRET environment variable)
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Token expiration: 30 minutes in milliseconds (1800000 ms)
app.jwt.expiration-ms=1800000

# Strict CORS: Only allow the local Angular development origin (Section 6)
app.cors.allowed-origin=http://localhost:4200

# ==============================================================================
# Springdoc / Swagger UI Configuration (Section 7)
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

logging.level.root=INFO
logging.level.com.sumpositive.ticketing=INFO