<header class="workspace-header">
  <a class="brand" routerLink="/dashboard" aria-label="Ticketing tool dashboard">
    <span class="brand-mark"><i class="bi bi-kanban-fill" aria-hidden="true"></i></span>
    <span>Ticketing<span class="brand-light"> tool</span></span>
  </a>

  <nav class="main-nav" aria-label="Main navigation">
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="bi bi-grid-1x2" aria-hidden="true"></i> Dashboard
    </a>
    <a routerLink="/tickets" routerLinkActive="active">
      <i class="bi bi-ticket-detailed" aria-hidden="true"></i> Tickets
    </a>
    <a routerLink="/board" routerLinkActive="active">
      <i class="bi bi-kanban" aria-hidden="true"></i> Board
    </a>
  </nav>

  <div class="account-actions">
    @if (currentUser$ | async; as user) {
      <div class="profile-menu" (keydown.escape)="isProfileOpen = false">
        <button
          type="button"
          class="account-label"
          aria-controls="profile-details"
          [attr.aria-expanded]="isProfileOpen"
          (click)="toggleProfile()"
        >
          <i class="bi bi-person-circle" aria-hidden="true"></i>
          {{ user.name }}
          <i class="bi bi-chevron-down profile-chevron" aria-hidden="true"></i>
        </button>
        @if (isProfileOpen) {
          <section class="profile-card" id="profile-details" aria-label="User information">
            <div class="profile-card-heading">
              <strong>{{ user.name }}</strong>
              <button
                type="button"
                class="profile-close"
                aria-label="Close user information"
                (click)="isProfileOpen = false"
              >
                <i class="bi bi-x-lg" aria-hidden="true"></i>
              </button>
            </div>
            <p><i class="bi bi-envelope" aria-hidden="true"></i> {{ user.email }}</p>
            <p><i class="bi bi-person-badge" aria-hidden="true"></i> User ID: {{ user.id }}</p>
          </section>
        }
      </div>
    } @else {
      <span class="account-label">
        <i class="bi bi-person-circle" aria-hidden="true"></i>
        User
      </span>
    }
    <button type="button" class="logout-button" (click)="authService.logout()">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      <span>Sign out</span>
    </button>
  </div>
</header>
